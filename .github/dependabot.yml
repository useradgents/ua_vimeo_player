# Dependabot keeps dependencies current by opening PRs when updates are
# available. See: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Dart/Flutter packages for the package itself.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Batch minor/patch bumps into a single PR to cut review noise; majors
      # still get their own PR so breaking changes are reviewed in isolation.
      pub-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Dart/Flutter packages for the example app.
  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      example-pub-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
