name: ua_vimeo_player
description: >-
  Play Vimeo videos in Flutter with full access to every documented player
  parameter, an imperative controller and a typed event stream. Android + iOS.
version: 0.1.0
repository: https://github.com/useradgents/ua_vimeo_player
issue_tracker: https://github.com/useradgents/ua_vimeo_player/issues
homepage: https://github.com/useradgents/ua_vimeo_player
topics:
  - vimeo
  - video
  - player
  - webview

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_inappwebview_platform_interface: ^1.3.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
